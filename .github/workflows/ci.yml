name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Size
        run: pnpm size

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the Lab gallery's "New" marks come from git.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @quartifex/lab exec playwright install --with-deps chromium
      # Behaviour tests: the hub and its demos, plus dailies and contactsheet against synthetic pages.
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/lab/test-results
            packages/*/test-results
          retention-days: 7

  # halcyon shows its own accessibility audit. Every push runs it as a gate (no axe
  # violations, Lighthouse accessibility 100, in every motion level); on main, a changed
  # result is committed back so the deployed page shows what CI measured.
  halcyon-audit:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@quartifex/site-halcyon
      - run: pnpm --filter @quartifex/site-halcyon exec playwright install --with-deps chromium
      - id: audit
        run: pnpm --filter @quartifex/site-halcyon run a11y --strict
      - name: Publish the audit to the page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.audit.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/halcyon/audit.json reports/halcyon/audit.md
          git commit -m "Publish the halcyon accessibility audit from CI [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halcyon-audit
          path: reports/halcyon/audit.*
          retention-days: 30
