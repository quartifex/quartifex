.blink{animation:blink 1.6s steps(1) infinite}
.slidex{animation:slidex 4.2s ease-in-out infinite}
.slidey{animation:slidey 3.8s ease-in-out infinite}
.sweep{animation:sweep 3.8s ease-in-out infinite}
.draw{stroke-dasharray:100;animation:draw 4.6s ease-in-out infinite}
.march{stroke-dasharray:4 4;animation:march 1.4s linear infinite}
.grow{animation:grow 2.6s ease-in-out infinite}
.growx{animation:growx 3.4s ease-in-out infinite}
.flick{animation:flick .9s steps(1) infinite}
.apart{animation:apart 4s ease-in-out infinite}
.stepdown{animation:stepdown 5.4s ease-in-out infinite}
.flight{animation:flight 6s ease-in-out infinite}
.clap{animation:clap 3.6s ease-in-out infinite}
.cycle{animation:cycle 4.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.g *{animation:none!important}}
