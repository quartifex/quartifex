.g{fill:none;stroke:var(--ink);stroke-width:4.3;stroke-linecap:round;stroke-linejoin:round}
.g .s{stroke:var(--ink)} .g .a{stroke:var(--acc)} .g .f{fill:var(--acc);stroke:none} .g .fi{fill:var(--ink);stroke:none}
.g .d{stroke:var(--ink);opacity:.4;stroke-width:3.4} .g .t{stroke-width:3} .g .a{stroke-width:5.4}
.g .a,.g .f{transition:stroke .35s,fill .35s} stop{transition:stop-color .45s}
.o{transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swing{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes shrink{0%,100%{transform:scale(1)}50%{transform:scale(.78)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes slidex{0%,100%{transform:translateX(-11px)}50%{transform:translateX(11px)}}
@keyframes slidey{0%,100%{transform:translateY(-6px)}50%{transform:translateY(6px)}}
@keyframes sweep{0%{transform:translateX(-34px);opacity:0}25%,75%{opacity:1}100%{transform:translateX(34px);opacity:0}}
@keyframes draw{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
@keyframes march{to{stroke-dashoffset:-16}}
@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes growx{0%,100%{transform:scaleX(.55)}50%{transform:scaleX(1)}}
@keyframes flick{0%{opacity:1}20%{opacity:.2}40%{opacity:.9}60%{opacity:.3}80%{opacity:1}100%{opacity:.5}}
@keyframes apart{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--dy,6px))}}
